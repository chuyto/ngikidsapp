# Render asigna $PORT en tiempo de ejecución (ej. 10000).
# La plantilla usa ${PORT}; start.sh lo sustituye con sed antes de arrancar nginx.
# Fallback a 8080 si no se define PORT.
server {
    listen ${PORT} default_server;

    index index.php index.html;
    server_name _;
    root /var/www/public;

    server_tokens off;

    # Las firmas de asistencia viajan como base64 (máx. 3 MB de imagen);
    # el default de Nginx (1 MB) las rechazaba con 413.
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Subida de firmas a Cloudinary puede tardar en conexiones lentas.
        fastcgi_read_timeout 120s;
    }
}