; php.ini personalizado para Laravel en Wasmer Edge.
; Se carga gracias a PHPRC=/app/wasmer-config/ (ver wasmer.toml).
; Referencia: https://docs.wasmer.io/edge/guides/php#custom-php-settings

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

upload_max_filesize = 20M
post_max_size = 25M

expose_php = 0
log_errors = 1
error_log = /dev/stderr

; Opcache: Wasmer recomienda desactivar la validacion de timestamps
; para apps PHP en Edge (mejor rendimiento + cold starts).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.max_file_size = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

date.timezone = America/Mexico_City
